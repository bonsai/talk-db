name: ingest

on:
  workflow_dispatch:
  schedule:
    # daily at 04:00 UTC
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  SKIP: "talk-db agents wf-errors issues localbqml bons.ai emoji-shiritori gh-chatgpt-ext idol-playlist showa-covers leanvj terminal-capture plego idol-db kimura chrome-ext-dummy cli-ext-man ext-cli suno-gen-crx community-based-sales auto-recap-skill journal r2r"
  INCLUDE: "research-rakugo talkscripts unipath-skills writing win-tips tips-word skill-crawler skill-consolidator pi-config-memo mimic-me hakkutu char-distribution yoshimoto-theater repos-analyze research-jev life-design-skill houki-skill essay-xxx SFショートショート SF落語 MX LX AX TX OX IX DDD BX WX Xx idol-podcast research-community burstha-p idol-p-agent producer-agent idol-live stage-search jobs-jules write-book progressive-life mimicme skill-template blade baku-go work-lexicon bqmlite-go inu.go jeva ext-install-skill ext-install-ext idol-portal wiki REORGANIZE mensetsukan larry ants-essay oppo-research CHO-HAN YonerAI CL4R1T4S word-ontology Mushochika idol-lab pi-skills WORKFLOW CHAT Tsumete Tsumi vocab-highlight rekai recap"

jobs:
  discover:
    name: Discover bonsai user repos
    runs-on: ubuntu-latest
    outputs:
      repo-names: ${{ steps.discover.outputs.repo-names }}
    steps:
      - name: Discover repos with markdown
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP: ${{ env.SKIP }}
          INCLUDE: ${{ env.INCLUDE }}
        run: |
          set -e
          
          # Text-focused repos to include
          INCLUDE="research-rakugo talkscripts unipath-skills writing win-tips tips-word skill-crawler skill-consolidator pi-config-memo mimic-me hakkutu char-distribution yoshimoto-theater repos-analyze research-jev life-design-skill houki-skill essay-xxx SFショートショート SF落語 MX LX AX TX OX IX DDD BX WX Xx idol-podcast research-community burstha-p idol-p-agent producer-agent idol-live stage-search jobs-jules write-book progressive-life mimicme skill-template blade baku-go work-lexicon bqmlite-go inu.go jeva ext-install-skill ext-install-ext idol-portal wiki REORGANIZE mensetsukan larry ants-essay oppo-research CHO-HAN YonerAI CL4R1T4S word-ontology Mushochika idol-lab pi-skills WORKFLOW CHAT Tsumete Tsumi vocab-highlight rekai recap"
          
          # Repos to skip
          SKIP="talk-db agents wf-errors issues localbqml bons.ai emoji-shiritori gh-chatgpt-ext idol-playlist showa-covers leanvj terminal-capture plego idol-db kimura chrome-ext-dummy cli-ext-man ext-cli suno-gen-crx community-based-sales auto-recap-skill journal r2r"
          
          python3 -c "
          import json, subprocess, sys, os

          skip = set(os.environ['SKIP'].split())
          include = set(os.environ['INCLUDE'].split())
          
          repos = []
          # Get all public repos for bonsai user
          url = 'https://api.github.com/users/bonsai/repos?per_page=100&type=all'
          
          while url:
              proc = subprocess.run(
                  ['gh', 'api', url, '--jq', '.[].name,.is_fork,.archived'],
                  capture_output=True, text=True
              )
              if proc.returncode != 0:
                  print(f'gh api failed: {proc.stderr}', file=sys.stderr)
                  break
              
              lines = proc.stdout.strip().split('\n')
              i = 0
              while i + 2 < len(lines):
                  name = lines[i]
                  fork = lines[i+1] == 'true'
                  archived = lines[i+2] == 'true'
                  if not fork and not archived:
                      repos.append(name)
                  i += 3
              
              if len(lines) < 300:  # 100 repos * 3 fields
                  break
              url = url.split('&page=')[0] + f'&page={url.split("page=")[-1].split("&")[0] if "page=" in url else 2}'

          # Filter
          result = [r for r in repos if r in include and r not in skip]
          print(f'Found {len(result)} candidate repos: {", ".join(result)}')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'repo-names={json.dumps(result)}\n')
          "
        env:
          SKIP: ${{ env.SKIP }}
          INCLUDE: ${{ env.INCLUDE }}

  ingest:
    name: Ingest all repos
    runs-on: ubuntu-latest
    needs: discover
    permissions:
      contents: write
    steps:
      - name: Checkout talk-db
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Clone and scan discovered repos
        id: clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAMES: ${{ needs.discover.outputs.repo-names }}
        run: |
          set -e
          mkdir -p _src

          # Clone each repo using GITHUB_TOKEN (auto-provided)
          python3 -c "
          import json, subprocess, sys, os
          repos = json.loads(os.environ['REPO_NAMES'])
          token = os.environ.get('GH_TOKEN', '')
          for name in repos:
              url = f'https://x-access-token:{token}@github.com/bonsai/{name}.git'
              print(f'Cloning {name}...')
              subprocess.run(['git', 'clone', '--depth', '1', url, f'_src/{name}'], check=True)
              print(f'  -> _src/{name}')
          "

          echo "src_count=$(ls _src/ | wc -l)" >> $GITHUB_OUTPUT
          echo "src_repos=$(ls _src/)" >> $GITHUB_OUTPUT
          ls -la _src/

      - name: Ingest all repos
        run: python scripts/ingest.py --repos $(ls _src/ | sed 's|^|_src/|' | paste -sd' ') --output data

      - name: Extract relations from passages
        run: |
          python scripts/extract_relations.py \
            --input data/passages.jsonl \
            --relations data/relations.jsonl \
            --output data/relations.jsonl \
            --mode append

      - name: Score relations with JEV
        run: |
          python3 scripts/jeva.py \
            --relations data/relations.jsonl \
            --instruction talk_material \
            --output data/relations_scored.jsonl \
            --min-score 0.5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build SQLite DB
        run: python scripts/build_db.py --data data --db db/talk.db

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ db/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: ingest $(date -u +%Y-%m-%d) + JEV scoring"
            git push
          fi